{% extends 'base.html' %}
{% block contenido %}
<div class="col-lg-7">
  <h1 class="fw-bold mb-4">{{ titulo }}</h1>
  <form method="post" class="form-estilo">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-dark rounded-pill">Guardar</button>
    <a class="btn btn-outline-dark rounded-pill" href="{% url 'gestion' %}">Cancelar</a>
  </form>
</div>
{% endblock %}
