<div class="col-md-6 col-lg-4">
  <div class="card card-lugar h-100 border-0 shadow-sm rounded-4 overflow-hidden">
    <img src="{{ lugar.imagen }}" class="card-img-top" alt="{{ lugar.nombre }}" loading="lazy">
    <div class="card-body d-flex flex-column">
      <span class="text-uppercase text-secondary fw-semibold small">{{ lugar.categoria.nombre }}</span>
      <h5 class="card-title mt-1">{{ lugar.nombre }}</h5>
      <p class="card-text text-secondary">{{ lugar.descripcion|truncatewords:20 }}</p>
      <a href="{% url 'detalle_lugar' lugar.pk %}" class="btn btn-dark btn-sm rounded-pill mt-auto align-self-start">Ver detalle</a>
    </div>
  </div>
</div>
